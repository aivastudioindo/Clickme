name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing key
        if: ${{ secrets.SIGNING_STORE_FILE }}
        run: echo "${{ secrets.SIGNING_STORE_FILE }}" | base64 -d > app/release-key.jks

      - name: Build release APK
        run: >-
          ./gradlew assembleRelease --no-daemon
          -PSIGNING_STORE_FILE=app/release-key.jks
          -PSIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}
          -PSIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}
          -PSIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clickme-release-apk
          path: app/build/outputs/apk/release/*.apk
