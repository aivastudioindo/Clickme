name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean Gradle caches
        run: rm -rf ~/.gradle/caches && rm -rf app/build && echo "caches cleared"

      - name: Decode signing key
        env:
          KEY_B64: ${{ secrets.SIGNING_STORE_FILE }}
        run: |
          echo "KEY_B64 len: ${#KEY_B64}"
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > app/release-key.jks
            echo "keystore decoded, size: $(wc -c < app/release-key.jks)"
          else
            echo "no signing secret set, build will be unsigned"
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_FILE: ${{ secrets.SIGNING_STORE_FILE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >-
          ./gradlew assembleRelease --no-daemon
          -PSIGNING_STORE_FILE=app/release-key.jks
          -PSIGNING_STORE_PASSWORD="$SIGNING_STORE_PASSWORD"
          -PSIGNING_KEY_ALIAS="$SIGNING_KEY_ALIAS"
          -PSIGNING_KEY_PASSWORD="$SIGNING_KEY_PASSWORD"

      - name: Sign APK with apksigner
        env:
          KS_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          if [ ! -f "$APK" ]; then echo "unsigned apk not found"; ls app/build/outputs/apk/release/; exit 1; fi
          API=$(ls $ANDROID_HOME/build-tools/*/apksigner | head -1)
          echo "apksigner: $API"
          "$API" sign --ks app/release-key.jks --ks-pass "pass:$KS_PASS" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" --out app/build/outputs/apk/release/app-release.apk "$APK"
          echo "signed apk produced"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clickme-release-apk
          path: app/build/outputs/apk/release/*.apk
